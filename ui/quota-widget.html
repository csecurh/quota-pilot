<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; connect-src 'none'; img-src 'none'; font-src 'none'; form-action 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
<title>AI Usage</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:transparent;color:#f6f8fa;font:12px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{min-width:292px;max-width:360px;padding:14px;border:1px solid rgba(255,255,255,.11);border-radius:18px;background:rgba(14,17,21,.96);box-shadow:0 16px 48px rgba(0,0,0,.28)}
.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:13px;font-weight:900;letter-spacing:.2px}.live{font-size:9px;font-weight:900;letter-spacing:1px;color:#7ce38b}
.provider{margin-top:13px}.name{font-size:10px;color:#b2bdca;text-transform:uppercase;font-weight:800;letter-spacing:.8px}
.main{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:8px}.metric{background:#0a0d10;border-radius:11px;padding:9px}.label{font-size:8px;color:#adbac6;font-weight:900;letter-spacing:.8px}
.value{display:block;margin-top:3px;font-size:17px;font-weight:900;white-space:nowrap}.reset{font-size:14px}.bar{height:6px;border-radius:99px;background:#252b32;overflow:hidden;margin-top:9px}
.fill{height:100%;width:0;border-radius:99px;background:#dbe2e9;transition:width .25s ease}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:11px;color:#a6b5c2;font-size:9px}
.insight{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}.insight .metric{padding:7px}.insight .value{font-size:12px}.alert{padding:8px 10px;margin-top:8px;border:1px solid rgba(255,191,105,.35);border-radius:9px;color:#ffbf69;font-weight:700;font-size:10px}.alert.critical{border-color:rgba(255,140,140,.45);color:#ff8c8c}.note{margin-top:5px;color:#a6b5c2;font-size:9px}.warn{color:#ffbf69}.critical{color:#ff8c8c}.empty{padding:18px 4px;color:#818b96;text-align:center}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="card">
  <div class="top"><span id="brand" class="brand">AI Usage</span><span id="state" class="live">LOCAL</span></div>
  <div id="content"><div class="empty">Leyendo cuota local…</div></div>
  <div class="footer"><span id="updated">—</span><span>auto · 30s</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=n=>Math.max(0,Math.min(100,Number(n)||0));
const pct=n=>n==null?'—':Math.round(Number(n))+'%';
const used=p=>p?.usedPercent!=null?Number(p.usedPercent):(p?.remainingPercent!=null?100-Number(p.remainingPercent):null);
const remain=p=>p?.remainingPercent!=null?Number(p.remainingPercent):(p?.usedPercent!=null?100-Number(p.usedPercent):null);
const severity=rem=>rem==null?'':rem<=15?'critical':rem<=30?'warn':'';
const providerLabel=p=>p?.provider==='claude_code'?'Claude Code':'Codex';

function countdown(iso){
  if(!iso)return '—';
  const target=typeof iso==='number'?iso*1000:Date.parse(iso);
  if(!Number.isFinite(target))return '—';
  let s=Math.max(0,Math.floor((target-Date.now())/1000));
  const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);
  return d>0?d+'d '+h+'h':h>0?h+'h '+m+'m':m+'m';
}
function el(tag,className,text){
  const node=document.createElement(tag);
  if(className)node.className=className;
  if(text!=null)node.textContent=String(text);
  return node;
}
function metric(label,value,className=''){
  const box=el('div','metric');
  box.append(el('span','label',label),el('b','value '+className,value));
  return box;
}
function duration(hours){
  if(typeof hours!=='number'||!Number.isFinite(hours)||hours<0)return '—';
  if(hours<1)return Math.round(hours*60)+'m';
  return hours<48?hours.toFixed(1)+'h':(hours/24).toFixed(1)+'d';
}
function rate(ratePerHour){
  return typeof ratePerHour==='number'&&Number.isFinite(ratePerHour)&&ratePerHour>=0
    ?ratePerHour.toFixed(1)+'%/h':'—';
}
function advisory(intelligence){
  const code=intelligence?.alert?.code;
  if(code==='quota_critical')return ['critical','Cuota casi agotada · queda 10% o menos'];
  if(code==='quota_low')return ['warn','Cuota baja · queda 20% o menos'];
  if(code==='pace_risk')return ['warn','Al ritmo observado, la cuota podría agotarse antes del reset'];
  return null;
}
function providerCard(p){
  const r=remain(p?.primary),u=used(p?.primary),reset=countdown(p?.primary?.resetsAt);
  const section=el('section','provider');
  const row=el('div','row');
  row.append(el('span','name',providerLabel(p)),el('span',severity(r),pct(r)+' restante'));
  const bar=el('div','bar');
  bar.setAttribute('role','progressbar');
  bar.setAttribute('aria-label','Cuota restante');
  bar.setAttribute('aria-valuemin','0');
  bar.setAttribute('aria-valuemax','100');
  if(r!=null)bar.setAttribute('aria-valuenow',String(Math.round(clamp(r))));
  const fill=el('div','fill');
  fill.style.width=clamp(r)+'%';
  bar.append(fill);
  const main=el('div','main');
  main.append(metric('USADO',pct(u)),metric('RESTANTE',pct(r),severity(r)),metric('RESET',reset,'reset'));
  section.append(row,bar,main);
  const intel=p?.intelligence;
  const insights=el('div','insight');
  insights.append(metric('CONSUMO/H',rate(intel?.burnRatePercentPerHour)),metric('AUTONOMÍA',duration(intel?.runwayHours)),metric('TIEMPO SIN CUOTA',duration(intel?.deadHours)));
  section.append(insights,el('div','note','Estimaciones locales · requieren al menos dos muestras'));
  const alert=advisory(intel);
  if(alert){
    const warning=el('div','alert '+(alert[0]==='critical'?'critical':''),alert[1]);
    warning.setAttribute('role','note');
    section.append(warning);
  }
  return section;
}
function render(data){
  const overview=data?.overview||data||{};
  const displayName=typeof overview?.host?.displayName==='string'&&overview.host.displayName.length<=32?overview.host.displayName:null;
  if(displayName){$('brand').textContent=displayName;document.title=displayName;}
  const providers=Array.isArray(overview?.providers)?overview.providers.slice(0,2):[];
  const content=$('content');
  content.replaceChildren();
  if(!providers.length)content.append(el('div','empty','Sin cuota disponible todavía.'));
  else for(const provider of providers)content.append(providerCard(provider));
  const generated=Date.parse(overview?.generatedAt);
  $('updated').textContent='actualizado '+new Date(Number.isFinite(generated)?generated:Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
let updating=false;
async function refresh(){
  if(updating||document.hidden)return;
  if(!window.openai?.callTool)return;
  updating=true;
  try{
    if(window.openai?.callTool){
      const result=await window.openai.callTool('get_overview',{});
      render(result?.structuredContent||result);
      $('state').textContent='LOCAL';$('state').className='live';
    }
  }catch{$('state').textContent='OFFLINE';$('state').className='warn'}
  finally{updating=false;}
}
function initial(){
  if(window.openai){$('brand').textContent='ChatGPT';document.title='ChatGPT';}
  const first=window.openai?.toolOutput;
  if(first)render(first);
  window.openai?.requestDisplayMode?.({mode:'pip'}).catch(()=>{});
  refresh();
  setInterval(refresh,30000);
}
initial();
</script>
</body>
</html>
