name: Bug report / Reportar error
description: Report a bug without personal data / Reporta errores sin datos personales
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please DO NOT submit credentials, OAuth tokens, logs with paths, transcripts, source code, session IDs, or vulnerabilities here. Security issues: see SECURITY.md. / Seguridad: consulta SECURITY.es.md.
  - type: dropdown
    id: host
    attributes:
      label: Host / Aplicación
      options:
        - Claude Code
        - Codex CLI
        - ChatGPT Desktop (experimental)
        - Local MCP host
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Version information / Información de versión
      placeholder: "QuotaPilot 0.5.0-rc.1, Node 22, host version (no identifiers)"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / Comportamiento real y pasos
      description: Use synthetic data / Usa datos ficticios; anonimiza los registros.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check / Privacidad
      options:
        - label: I removed private data, tokens, paths, prompts and transcripts / Quité datos privados, tokens, rutas, prompts y transcripciones.
          required: true
